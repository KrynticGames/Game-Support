name: iOS build check - Word Havoc and Brain Attack

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-release/**'
      - 'play/word-havoc.html'
      - 'play/brain-attack.html'
      - '.github/workflows/ios-game-build.yml'

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Build ${{ matrix.game }} for iOS Simulator
    runs-on: macos-26
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        game: [word-havoc, brain-attack]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Xcode 26 or newer
        shell: bash
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          major=$(xcodebuild -version | awk '/^Xcode / {split($2,a,"."); print a[1]}')
          test "$major" -ge 26
      - name: Prepare source
        run: node ios-release/prepare.mjs "${{ matrix.game }}"
      - name: Install native runtime
        working-directory: ios-release/generated/${{ matrix.game }}
        run: npm install --no-audit --no-fund
      - name: Generate native iOS project
        working-directory: ios-release/generated/${{ matrix.game }}
        run: |
          npx cap add ios --packagemanager SPM
          npx cap sync ios
      - name: Compile simulator app without Apple signing
        working-directory: ios-release/generated/${{ matrix.game }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ./DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Archive simulator test app
        working-directory: ios-release/generated/${{ matrix.game }}
        run: |
          app=DerivedData/Build/Products/Debug-iphonesimulator/App.app
          test -d "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "../../${{ matrix.game }}-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-unsigned-ios-simulator
          path: ios-release/${{ matrix.game }}-simulator.zip
          if-no-files-found: error
