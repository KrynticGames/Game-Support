<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Havoc — Play | Kryntic Games</title><style>body{background:#10141d;color:#f7f8ff;font:17px/1.6 system-ui,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh}main{text-align:center;padding:28px;max-width:560px}a{color:#e6c46e}button{background:#e6c46e;color:#0f1115;border:0;border-radius:8px;font:inherit;padding:12px 22px;cursor:pointer}</style></head><body><main><h1>Loading Word Havoc</h1><p id="status">Preparing game…</p><button id="retry" hidden onclick="location.reload()">Retry</button><p><a href="../index.html">Kryntic Games</a></p></main><script>(async()=>{try{const files=['word-havoc-part-01.txt','word-havoc-part-02.txt','word-havoc-part-03.txt','word-havoc-part-04.txt'];const parts=[];for(let i=0;i<files.length;i++){document.getElementById('status').textContent='Loading game '+(i+1)+' of '+files.length+'…';const r=await fetch(files[i],{cache:'no-store'});if(!r.ok)throw new Error('Game file '+(i+1)+' unavailable ('+r.status+')');parts.push(await r.text())}const source=parts.join('');if(!source.includes('<!doctype html>')||!source.includes('</html>'))throw new Error('Incomplete game source');document.open();document.write(source);document.close()}catch(e){document.getElementById('status').textContent='Unable to load game: '+e.message;document.getElementById('retry').hidden=false;console.error(e)}})();</script></body></html>
